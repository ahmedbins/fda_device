# Deploys both Cloudflare Pages sites whenever main changes, whoever pushed or merged:
#   fda-device-internaluseonly  (Internal Use Only)
#   fda-device-index            (Main)
# The Cloudflare secrets are given only to the two deploy steps, never to install/test.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
# See docs/DEPLOYMENT.md. "Run workflow" on the Actions tab redeploys main by hand.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push replaces a deploy still waiting to start.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Builds the app and runs every automated check; a failure stops both deploys.
      - run: npm test

      - name: Build Main
        run: npm run build:pages

      - name: Build Internal Use Only
        run: npm run build:pages:internal

      - name: Deploy to Internal Use Only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual deploy' }}
        run: npx wrangler pages deploy work/cloudflare-pages-internal --project-name=fda-device-internaluseonly --branch=main --commit-hash="$GITHUB_SHA" --commit-message="${COMMIT_MESSAGE%%$'\n'*}"

      - name: Deploy to Main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual deploy' }}
        run: npx wrangler pages deploy work/cloudflare-pages --project-name=fda-device-index --branch=main --commit-hash="$GITHUB_SHA" --commit-message="${COMMIT_MESSAGE%%$'\n'*}"
