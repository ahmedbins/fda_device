# Scheduled refresher for the FCC equipment-authorization snapshot (see README.md).
name = "fcc-snapshot-refresh"
main = "src/index.ts"
compatibility_date = "2025-12-01"
workers_dev = true

[triggers]
# Every two hours at :23, away from the top of the hour when most scheduled jobs hit shared services.
# Scopes captured in the last 10 hours are skipped, so a healthy day still makes about two captures.
crons = ["23 */2 * * *"]

[[kv_namespaces]]
binding = "FCC_SNAPSHOT"
id = "0a2285a04abf4e499d29e9d9a40806bb"

[vars]
FCC_SCOPES = "KWC,2A3UL"
